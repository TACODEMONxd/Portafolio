<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comparativa Histórica de Emisiones (Transparente)</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --accent: #3498db;
            --text: #ffffff; /* Texto blanco para fondos oscuros */
            --text-muted: #e0e0e0;
        }
        
        /* Fondo transparente y adaptable */
        html, body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: transparent; /* Sin fondo */
            color: var(--text);
            height: 100%;
            width: 100%;
            overflow-x: hidden;
            margin: 0;
            padding: 0;
        }
        
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
        }

        /* Contenedor transparente */
        .widget {
            background: transparent; /* Sin fondo de tarjeta */
            width: 100%;
            max-width: 1000px;
            height: 100%;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        /* Encabezado */
        .header { text-align: center; }
        .header h2 {
            font-size: 1.4rem;
            font-weight: 700;
            color: #ffffff;
            text-shadow: 0 2px 5px rgba(0,0,0,0.8); /* Sombra para legibilidad */
            line-height: 1.3;
        }
        .header p {
            font-size: .85rem;
            color: var(--text-muted);
            text-shadow: 0 1px 3px rgba(0,0,0,0.8);
            margin-top: 4px;
        }

        /* Controles (Chips) */
        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            justify-content: center;
            padding: 5px;
            /* Fondo muy sutil para agrupar los botones */
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            backdrop-filter: blur(4px);
        }
        .chip {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: .78rem;
            cursor: pointer;
            border: 1.5px solid rgba(255,255,255,0.3);
            background: rgba(255,255,255,0.1);
            color: #ffffff;
            transition: all .2s ease;
            user-select: none;
            text-shadow: 0 1px 2px rgba(0,0,0,0.5);
        }
        .chip:hover { background: rgba(255,255,255,0.2); }
        .chip.active {
            border-color: var(--chip-color, var(--accent));
            background: rgba(255,255,255,0.2);
            font-weight: 600;
            box-shadow: 0 0 10px rgba(255,255,255,0.2);
        }
        .chip .dot {
            width: 10px; height: 10px;
            border-radius: 50%;
            background: var(--chip-color, var(--accent));
            flex-shrink: 0;
            box-shadow: 0 0 5px rgba(0,0,0,0.5);
        }
        .chip input { display: none; }

        /* Gráfico */
        .chart-wrap {
            position: relative;
            width: 100%;
            height: 0;
            padding-bottom: 50%;   /* Aspect ratio */
            min-height: 280px;
        }
        .chart-wrap canvas {
            position: absolute;
            inset: 0;
            width: 100% !important;
            height: 100% !important;
        }

        /* Fuente */
        .source {
            text-align: right;
            font-size: .7rem;
            color: var(--text-muted);
            text-shadow: 0 1px 2px rgba(0,0,0,0.8);
        }
        .source a { color: var(--accent); text-decoration: none; text-shadow: none; }

        /* Responsive */
        @media (max-width: 600px) {
            body { padding: 5px; }
            .header h2 { font-size: 1.1rem; }
            .chip { font-size: .7rem; padding: 3px 8px; }
            .chart-wrap { padding-bottom: 65%; min-height: 220px; }
            .controls { padding: 3px; }
        }
    </style>
</head>
<body>

    <div class="controls" id="controls"></div>

    <div class="chart-wrap">
        <canvas id="chart"></canvas>

    <div class="source">
        Datos: <a href="https://www.climatewatchdata.org" target="_blank" rel="noopener">Climate Watch – Historical GHG Emissions</a> · Total incl. LULUCF, todos los GEI

// Países activos por defecto
const active = new Set(["China","Estados Unidos","India","UE-27","Brasil"]);

// ── Crear chips ──
const controlsEl = document.getElementById("controls");
Object.entries(COUNTRIES).forEach(([name, info]) => {
    const label = document.createElement("label");
    label.className = "chip" + (active.has(name) ? " active" : "");
    label.style.setProperty("--chip-color", info.color);

    const cb = document.createElement("input");
    cb.type = "checkbox";
    cb.checked = active.has(name);
    cb.addEventListener("change", () => {
        if (cb.checked) active.add(name); else active.delete(name);
        label.classList.toggle("active", cb.checked);
        redraw();
    });

    const dot = document.createElement("span");
    dot.className = "dot";

    label.append(cb, dot, document.createTextNode(" " + name));
    controlsEl.appendChild(label);
});

// ── Chart.js ──
const ctx = document.getElementById("chart").getContext("2d");

// Ajustes globales de Chart.js para fondo transparente
Chart.defaults.color = '#ffffff'; 
Chart.defaults.borderColor = 'rgba(255, 255, 255, 0.1)';
Chart.defaults.font.family = "'Segoe UI', system-ui, sans-serif";

function buildDatasets() {
    return [...active].map(name => ({
        label: name,
        data: COUNTRIES[name].data,
        borderColor: COUNTRIES[name].color,
        backgroundColor: COUNTRIES[name].color + "22", // Relleno semitransparente
        borderWidth: 2.5, // Líneas un poco más gruesas para resaltar
        pointRadius: 0,
        pointHitRadius: 10,
        tension: 0.35,
        fill: true
    }));
}

const chart = new Chart(ctx, {
    type: "line",
    data: { labels: YEARS, datasets: buildDatasets() },
    options: {
        responsive: true,
        maintainAspectRatio: false,
        interaction: { mode: "index", intersect: false },
        plugins: {
            legend: {
                display: false // Ocultamos la leyenda porque ya usamos los chips
            },
            tooltip: {
                backgroundColor: "rgba(20, 30, 40, 0.9)",
                titleFont: { size: 13, weight: 'bold' },
                bodyFont: { size: 12 },
                padding: 12,
                cornerRadius: 8,
                borderColor: 'rgba(255,255,255,0.2)',
                borderWidth: 1,
                callbacks: {
                    label: ctx => {
                        const v = ctx.parsed.y;
                        return " " + ctx.dataset.label + ": " + v.toLocaleString("es") + " MtCO₂e";
                    }
                }
            }
        },
        scales: {
            y: {
                beginAtZero: true,
                grid: { color: "rgba(255, 255, 255, 0.15)" }, // Cuadrícula sutil blanca
                title: { 
                    display: true, 
                    text: "Millones de Toneladas (MtCO₂e)", 
                    font: { size: 11, weight: 'bold' },
                    color: '#e0e0e0'
                },
                ticks: { 
                    font: { size: 10 },
                    color: '#e0e0e0',
                    callback: v => v >= 1000 ? (v/1000).toFixed(0) + "k" : v 
                }
            },
            x: {
                grid: { display: false }, // Sin líneas verticales para limpiar
                title: { 
                    display: true, 
                    text: "Año", 
                    font: { size: 11, weight: 'bold' },
                    color: '#e0e0e0'
                },
                ticks: {
                    font: { size: 10 },
                    color: '#e0e0e0',
                    maxRotation: 45,
                    autoSkip: true,
                    maxTicksLimit: 12
                }
            }
        }
    }
});

function redraw() {
    chart.data.datasets = buildDatasets();
    chart.update();
}
</script>
