<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Misión 1.5°C - Simulador Climático Minimalista (Textos grandes)</title>
    <style>
        :root {
            --sky-base: #aee2ff;
            --sky-warm: #ffd89b;
            --sky-hot: #e74c3c;
            --text-dark: #2c3e50;
            --panel-bg: rgba(255, 255, 255, 0.85);
            --danger: #e74c3c;
            --success: #27ae60;
            --warning: #f39c12;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: transparent;
            font-family: 'Segoe UI', Roboto, sans-serif;
        }

        .sim-container {
            position: relative;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, rgba(174, 226, 255, 0.3) 0%, rgba(255, 255, 255, 0) 100%);
            overflow: hidden;
            transition: background 2s ease;
        }

        /* --- LÍNEA DE TIEMPO (texto más grande) --- */
        .timeline-bar {
            position: absolute;
            top: 2%;
            left: 0;
            width: 100%;
            height: 6%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 5%;
            box-sizing: border-box;
            z-index: 30;
            background: transparent;
        }
        
        .timeline-step {
            color: #ffffff;
            font-size: 2.2vh; /* Aumentado */
            font-weight: bold;
            text-shadow: 0 0.2vh 0.5vh rgba(0,0,0,0.9);
            opacity: 0.6;
            transition: all 0.5s ease;
            padding: 0.5vh 1.5vw;
            border-radius: 15px;
            white-space: nowrap;
        }
        
        .timeline-step.active {
            opacity: 1;
            background: var(--danger);
            box-shadow: 0 0 10px var(--danger);
            transform: scale(1.1);
            text-shadow: none;
        }

        /* --- SOL --- */
        .sun-container {
            position: absolute;
            top: 12%;
            right: 8%;
            width: 18vh;
            height: 18vh;
            transition: all 2s ease;
            z-index: 1;
        }

        .sun {
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, #f1c40f 40%, #f39c12 100%);
            border-radius: 50%;
            box-shadow: 0 0 5vh #f1c40f;
            position: relative;
            animation: pulseSun 3s infinite alternate;
            transition: background 2s, box-shadow 2s;
        }

        .sim-container.hot .sun {
            background: radial-gradient(circle, #e74c3c 40%, #c0392b 100%);
            box-shadow: 0 0 12vh #e74c3c;
        }

        @keyframes pulseSun {
            0% { transform: scale(1); }
            100% { transform: scale(1.05); }
        }

        .heat-wave {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0; left: 0;
            background: radial-gradient(circle, transparent 50%, rgba(231, 76, 60, 0.2) 100%);
            opacity: 0;
            transition: opacity 2s;
            pointer-events: none;
            z-index: 4;
        }
        .sim-container.hot .heat-wave { opacity: 1; animation: pulseHeat 2s infinite alternate; }
        @keyframes pulseHeat {
            0% { transform: scale(1); }
            100% { transform: scale(1.05); }
        }

        /* --- BURBUJA DE GASES --- */
        .greenhouse-bubble {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 0%;
            background: linear-gradient(to top, rgba(231, 76, 60, 0.6) 0%, rgba(241, 196, 15, 0.2) 100%);
            border-top: 0.5vh solid rgba(231, 76, 60, 0.9);
            box-shadow: 0 -1vh 3vh rgba(231, 76, 60, 0.4);
            z-index: 6;
            transition: height 1s cubic-bezier(0.4, 0, 0.2, 1);
            pointer-events: none;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .bubble-label {
            background: var(--danger);
            color: white;
            padding: 0.5vh 2vw;
            border-radius: 0 0 12px 12px;
            font-size: 1.8vh; /* Aumentado */
            font-weight: bold;
            opacity: 0;
            transition: opacity 1s;
            transform: translateY(-100%);
            letter-spacing: 1px;
        }
        .greenhouse-bubble.active .bubble-label { opacity: 1; }

        /* --- SUELO Y CIUDAD --- */
        .ground {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 28%;
            background: rgba(140, 192, 132, 0.5);
            z-index: 2;
            transition: background 2s;
            backdrop-filter: blur(2px);
        }
        .sim-container.hot .ground { background: rgba(166, 124, 82, 0.6); }

        .city-items {
            position: absolute;
            bottom: 20%;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            gap: 2vw;
            z-index: 10;
            padding: 0 1%;
            box-sizing: border-box;
            flex-wrap: wrap;
        }

        .obj-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.5vh;
        }

        .interactive-obj {
            font-size: 9vh; /* Aumentado */
            cursor: pointer;
            position: relative;
            transition: transform 0.3s, filter 0.3s;
            filter: grayscale(0.5) opacity(0.7);
            user-select: none;
            line-height: 1;
            text-shadow: 0 0.5vh 1vh rgba(0,0,0,0.3);
        }

        .interactive-obj:hover {
            transform: scale(1.15) translateY(-2vh);
            filter: grayscale(0) opacity(1);
        }

        .interactive-obj.active {
            filter: grayscale(0) opacity(1) drop-shadow(0 1.5vh 2vh rgba(0,0,0,0.4));
            transform: scale(1.1) translateY(-1vh);
        }

        .obj-label {
            background: rgba(0,0,0,0.75);
            color: white;
            padding: 0.4vh 1.2vw;
            border-radius: 6px;
            font-size: 1.8vh; /* Aumentado */
            font-weight: bold;
            opacity: 0;
            transition: opacity 0.3s;
            white-space: nowrap;
        }
        .interactive-obj:hover + .obj-label, .interactive-obj.active + .obj-label { opacity: 1; }

        /* Humo */
        .smoke-container {
            position: absolute;
            bottom: 80%;
            left: 50%;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        .smoke {
            position: absolute;
            bottom: 0;
            left: 50%;
            width: 2.5vh;
            height: 2.5vh;
            background: rgba(80, 80, 80, 0.6);
            border-radius: 50%;
            opacity: 0;
        }

        .interactive-obj.active .smoke:nth-child(1) { animation: rise 2s infinite 0s; }
        .interactive-obj.active .smoke:nth-child(2) { animation: rise 2s infinite 0.5s; }
        .interactive-obj.active .smoke:nth-child(3) { animation: rise 2s infinite 1s; }
        .interactive-obj.active .smoke:nth-child(4) { animation: rise 2s infinite 1.5s; }

        @keyframes rise {
            0% { transform: translate(-50%, 0) scale(1); opacity: 0.8; }
            100% { transform: translate(-50%, -20vh) scale(4); opacity: 0; }
        }

        /* --- PANEL DE CONTROL (más grande y legible) --- */
        .control-panel {
            position: absolute;
            top: 10%;
            right: 3%;
            width: 24%; /* Un poco más ancho */
            min-width: 180px;
            background: var(--panel-bg);
            border-radius: 16px;
            padding: 2vh 1.2vw;
            box-shadow: 0 1vh 3vh rgba(0,0,0,0.2);
            z-index: 20;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.7);
            display: flex;
            flex-direction: column;
            gap: 1.5vh;
            align-items: center;
        }

        .temp-display {
            font-size: 6vh; /* Aumentado */
            font-weight: 800;
            text-align: center;
            color: var(--success);
            transition: color 0.5s;
            line-height: 1;
            text-shadow: 0 0.2vh 0.5vh rgba(0,0,0,0.1);
        }
        
        .thermometer {
            width: 100%;
            height: 2.5vh;
            background: rgba(0,0,0,0.1);
            border-radius: 10px;
            overflow: hidden;
            position: relative;
        }

        .thermometer-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(to right, #2ecc71, #f1c40f, #e74c3c);
            border-radius: 10px;
            transition: width 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .status-message {
            font-size: 2.2vh; /* Aumentado */
            font-weight: bold;
            text-align: center;
            padding: 1.2vh;
            border-radius: 8px;
            background: rgba(39, 174, 96, 0.15);
            color: var(--success);
            transition: all 0.5s;
            min-height: 4.5vh;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            box-sizing: border-box;
            line-height: 1.3;
        }

        /* Ficha Didáctica (texto más grande) */
        .fact-card {
            background: rgba(255, 255, 255, 0.95);
            border-left: 5px solid var(--text-dark);
            padding: 1.2vh 1vw;
            border-radius: 6px;
            font-size: 1.8vh; /* Aumentado */
            color: #222;
            display: none;
            animation: slideIn 0.3s ease;
            box-shadow: 0 0.5vh 1vh rgba(0,0,0,0.08);
            line-height: 1.45;
            width: 100%;
            box-sizing: border-box;
        }
        .fact-card.show { display: block; }
        .fact-card strong { color: var(--danger); display: block; margin-bottom: 0.6vh; font-size: 2vh;}

        @keyframes slideIn {
            from { opacity: 0; transform: translateX(20px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .btn-reset {
            width: 100%;
            padding: 1.2vh;
            background: var(--text-dark);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 3vh; /* Aumentado */
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5vw;
            line-height: 1;
        }
        .btn-reset:hover { background: #1a252c; transform: scale(1.05); }

        /* Instrucciones (texto más grande) */
        .instruction {
            position: absolute;
            bottom: 2%;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 1.2vh 2.5vw;
            border-radius: 30px;
            font-size: 2vh; /* Aumentado */
            z-index: 20;
            pointer-events: none;
            transition: opacity 0.5s;
            backdrop-filter: blur(4px);
            white-space: nowrap;
            font-weight: bold;
            letter-spacing: 0.5px;
            box-shadow: 0 0.5vh 1vh rgba(0,0,0,0.3);
        }

        /* --- ESTADOS CLIMÁTICOS --- */
        .sim-container.hot {
            background: radial-gradient(circle, transparent 40%, rgba(231, 76, 60, 0.4) 100%);
        }
        
        .sim-container.warm {
            background: radial-gradient(circle, transparent 40%, rgba(255, 216, 155, 0.4) 100%);
        }

        @media (max-width: 800px) {
            .interactive-obj { font-size: 7vh; }
            .control-panel { width: 30%; padding: 1.5vh; min-width: 150px; }
            .temp-display { font-size: 4.5vh; }
            .status-message { font-size: 1.8vh; }
            .fact-card { font-size: 1.5vh; }
            .btn-reset { font-size: 2.5vh; }
            .instruction { font-size: 1.7vh; padding: 1vh 2vw; white-space: normal; text-align: center; max-width: 90%; }
            .timeline-step { font-size: 1.8vh; }
            .obj-label { font-size: 1.5vh; }
            .bubble-label { font-size: 1.5vh; }
            .city-items { gap: 1.5vw; }
        }
    </style>
</head>
<body>

<div class="sim-container" id="simContainer">
    
    <!-- Línea de tiempo -->
    <div class="timeline-bar">
        <div class="timeline-step" id="step-1">1850: Preindustrial</div>
        <div class="timeline-step" id="step-2">1950: Aceleración</div>
        <div class="timeline-step" id="step-3">2020: Crisis</div>
    </div>

    <div class="sun-container" id="sunContainer">
        <div class="sun"></div>
    </div>
    <div class="heat-wave"></div>

    <!-- Panel minimalista: solo termómetro y reinicio -->
    <div class="control-panel">
        <div class="temp-display" id="tempDisplay">+0.8°C</div>
        <div class="thermometer">
            <div class="thermometer-fill" id="thermometerFill"></div>
        </div>
        <div class="status-message" id="statusMessage">Estable</div>
        <div class="fact-card" id="factCard">
            <strong id="factTitle">Dato</strong>
            <span id="factText"></span>
        </div>
        <button class="btn-reset" id="resetBtn" title="Reiniciar simulación">⟲</button>
    </div>

    <div class="greenhouse-bubble" id="bubble">
        <div class="bubble-label">GEI</div>
    </div>

    <div class="ground"></div>

    <div class="city-items" id="cityItems"></div>

    <div class="instruction" id="instruction">👆 Toca los iconos para activar/desactivar emisiones</div>

</div>

<script>
    // Espectro ampliado de fuentes de emisión
    const sources = [
        { id: 'factory', icon: '🏭', name: 'Fábrica', temp: 0.8, fuel: 'Carbón / Gas', desc: 'La industria pesada quema combustibles fósiles liberando CO₂ y otros gases.' },
        { id: 'car', icon: '🚗', name: 'Auto', temp: 0.3, fuel: 'Gasolina / Diésel', desc: 'El motor de combustión emite CO₂, NOx y partículas.' },
        { id: 'cow', icon: '🐄', name: 'Ganadería', temp: 0.5, fuel: 'Metano (CH₄)', desc: 'La digestión del ganado libera metano, 25 veces más potente que el CO₂.' },
        { id: 'plane', icon: '✈️', name: 'Avión', temp: 0.6, fuel: 'Queroseno', desc: 'A gran altitud, las emisiones tienen un impacto térmico amplificado.' },
        { id: 'aerosol', icon: '🧴', name: 'Aerosoles', temp: 0.4, fuel: 'Gases fluorados', desc: 'Los aerosoles y refrigerantes liberan HFC, potentes gases de efecto invernadero.' },
        { id: 'waste', icon: '🗑️', name: 'Residuos', temp: 0.35, fuel: 'Metano (CH₄)', desc: 'La descomposición de basura orgánica en vertederos genera metano.' },
        { id: 'deforest', icon: '🪓', name: 'Deforestación', temp: 0.7, fuel: 'CO₂ liberado', desc: 'Al talar bosques, se libera el carbono almacenado y se pierde sumidero.' },
        { id: 'tree', icon: '🌳', name: 'Bosque', temp: -0.5, fuel: 'Sumidero', desc: '¡Aliado! Absorbe CO₂ mediante fotosíntesis.' }
    ];

    let state = {};
    sources.forEach(s => state[s.id] = false); 

    const container = document.getElementById('simContainer');
    const cityItems = document.getElementById('cityItems');
    const bubble = document.getElementById('bubble');
    const tempDisplay = document.getElementById('tempDisplay');
    const thermometerFill = document.getElementById('thermometerFill');
    const statusMessage = document.getElementById('statusMessage');
    const instruction = document.getElementById('instruction');
    const factCard = document.getElementById('factCard');
    const factTitle = document.getElementById('factTitle');
    const factText = document.getElementById('factText');
    const step1 = document.getElementById('step-1');
    const step2 = document.getElementById('step-2');
    const step3 = document.getElementById('step-3');

    // Generar iconos
    sources.forEach(source => {
        const wrapper = document.createElement('div');
        wrapper.className = 'obj-wrapper';
        
        const el = document.createElement('div');
        el.className = 'interactive-obj';
        el.id = `obj-${source.id}`;
        
        let smokeHTML = '';
        if(source.id !== 'tree') {
            smokeHTML = `<div class="smoke-container">
                <div class="smoke"></div><div class="smoke"></div>
                <div class="smoke"></div><div class="smoke"></div>
            </div>`;
        }

        el.innerHTML = `${smokeHTML}${source.icon}`;
        
        const label = document.createElement('div');
        label.className = 'obj-label';
        label.innerText = source.name;

        el.addEventListener('click', () => toggleSource(source.id, el));
        
        wrapper.appendChild(el);
        wrapper.appendChild(label);
        cityItems.appendChild(wrapper);
    });

    function toggleSource(id, element) {
        state[id] = !state[id]; 
        instruction.style.opacity = '0';

        if (state[id]) {
            element.classList.add('active');
            const data = sources.find(s => s.id === id);
            factTitle.innerText = `${data.icon} ${data.name}`;
            factText.innerText = data.desc;
            factCard.classList.add('show');
        } else {
            element.classList.remove('active');
            const anyActive = sources.some(s => state[s.id] && s.id !== 'tree');
            if (!anyActive) factCard.classList.remove('show');
        }

        updateSimulation();
    }

    function updateSimulation() {
        let totalTemp = 0;

        sources.forEach(source => {
            if (state[source.id]) {
                totalTemp += source.temp;
            }
        });

        let displayTemp = totalTemp + 0.8; 
        if (displayTemp < 0) displayTemp = 0;
        tempDisplay.innerText = '+' + displayTemp.toFixed(1) + '°C';

        let percentage = (displayTemp / 4.0) * 100;
        if (percentage > 100) percentage = 100;
        thermometerFill.style.width = percentage + '%';

        let bubbleHeight = (displayTemp / 4.0) * 60; 
        if (bubbleHeight > 60) bubbleHeight = 60;
        bubble.style.height = bubbleHeight + '%';

        if (bubbleHeight > 5) {
            bubble.classList.add('active');
        } else {
            bubble.classList.remove('active');
        }

        container.classList.remove('hot', 'warm');

        if (displayTemp < 1.5) {
            container.classList.add('warm');
            tempDisplay.style.color = 'var(--success)';
            statusMessage.className = 'status-message';
            statusMessage.innerText = '✅ < 1.5°C';
            
            step1.classList.add('active');
            step2.classList.remove('active');
            step3.classList.remove('active');

        } else if (displayTemp < 2.5) {
            container.classList.add('warm');
            tempDisplay.style.color = 'var(--warning)';
            statusMessage.className = 'status-message warning';
            statusMessage.innerText = '⚠️ Efectos visibles';
            
            step1.classList.remove('active');
            step2.classList.add('active');
            step3.classList.remove('active');

        } else {
            container.classList.add('hot');
            tempDisplay.style.color = 'var(--danger)';
            statusMessage.className = 'status-message danger';
            statusMessage.innerText = '🚨 ¡ALERTA!';
            
            step1.classList.remove('active');
            step2.classList.remove('active');
            step3.classList.add('active');
        }
    }

    document.getElementById('resetBtn').addEventListener('click', () => {
        sources.forEach(source => {
            state[source.id] = false;
            document.getElementById(`obj-${source.id}`).classList.remove('active');
        });
        
        instruction.style.opacity = '1';
        factCard.classList.remove('show');
        updateSimulation();
    });

    updateSimulation();

</script>
</body>
</html>
