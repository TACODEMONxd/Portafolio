<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La Burbuja de Calor - Efecto Invernadero</title>
    <style>
        :root {
            --sky-base: #aee2ff;
            --sky-hot: #ff9a76;
            --sky-toxic: #d35400;
            --text-dark: #2c3e50;
            --danger: #e74c3c;
            --success: #27ae60;
            --panel-bg: rgba(255, 255, 255, 0.95);
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, sans-serif;
            background-color: #1a252c;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .sim-container {
            position: relative;
            width: 100%;
            max-width: 1000px;
            height: 600px;
            background-color: var(--sky-base);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            transition: background-color 2s ease;
        }

        /* --- EL SOL Y LOS RAYOS --- */
        .sun-container {
            position: absolute;
            top: 40px;
            right: 80px;
            width: 100px;
            height: 100px;
        }

        .sun {
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, #f1c40f 40%, #f39c12 100%);
            border-radius: 50%;
            box-shadow: 0 0 40px #f1c40f;
            position: relative;
            z-index: 5;
            animation: pulseSun 3s infinite alternate;
        }

        @keyframes pulseSun {
            0% { transform: scale(1); box-shadow: 0 0 40px #f1c40f; }
            100% { transform: scale(1.05); box-shadow: 0 0 60px #f1c40f; }
        }

        /* Rayos del sol rebotando */
        .ray {
            position: absolute;
            top: 50px;
            right: 130px;
            width: 4px;
            height: 300px;
            background: linear-gradient(to bottom, rgba(241, 196, 15, 0.8), transparent);
            transform-origin: top right;
            transform: rotate(30deg);
            opacity: 0.6;
            pointer-events: none;
        }

        /* --- LA BURBUJA DE GASES (El Efecto Invernadero) --- */
        .greenhouse-bubble {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 0%; /* Empieza en 0, crece hacia arriba */
            background: linear-gradient(to top, rgba(231, 76, 60, 0.4) 0%, rgba(241, 196, 15, 0.2) 100%);
            border-top: 6px dashed rgba(231, 76, 60, 0.7);
            z-index: 6;
            transition: height 1s cubic-bezier(0.4, 0, 0.2, 1), background 1s;
            pointer-events: none;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .bubble-label {
            background: var(--danger);
            color: white;
            padding: 5px 15px;
            border-radius: 0 0 10px 10px;
            font-size: 0.8rem;
            font-weight: bold;
            opacity: 0;
            transition: opacity 1s;
            transform: translateY(-100%);
        }
        .greenhouse-bubble.active .bubble-label { opacity: 1; }

        /* --- SUELO Y CIUDAD --- */
        .ground {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 150px;
            background: #8cc084;
            z-index: 2;
            transition: background 2s;
        }

        .city-items {
            position: absolute;
            bottom: 100px;
            width: 100%;
            display: flex;
            justify-content: space-around;
            align-items: flex-end;
            z-index: 10;
            padding: 0 50px;
            box-sizing: border-box;
        }

        /* Objetos interactivos */
        .interactive-obj {
            font-size: 4rem;
            cursor: pointer;
            position: relative;
            transition: transform 0.2s, filter 0.3s;
            filter: grayscale(0.5) opacity(0.7); /* Inactivos por defecto */
            user-select: none;
        }

        .interactive-obj:hover {
            transform: scale(1.1) translateY(-5px);
            filter: grayscale(0) opacity(1);
        }

        .interactive-obj.active {
            filter: grayscale(0) opacity(1) drop-shadow(0 0 15px rgba(231, 76, 60, 0.8));
            transform: scale(1.1);
        }

        /* Sistema de humo */
        .smoke {
            position: absolute;
            bottom: 100%;
            left: 50%;
            width: 20px;
            height: 20px;
            background: rgba(100, 100, 100, 0.6);
            border-radius: 50%;
            opacity: 0;
            pointer-events: none;
        }

        .interactive-obj.active .smoke {
            animation: riseSmoke 2s infinite ease-out;
        }

        @keyframes riseSmoke {
            0% { transform: translate(-50%, 0) scale(1); opacity: 0.8; }
            100% { transform: translate(-50%, -100px) scale(3); opacity: 0; }
        }

        /* --- PANEL DE CONTROL LATERAL --- */
        .control-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            width: 280px;
            background: var(--panel-bg);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            z-index: 20;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.5);
        }

        .panel-title {
            margin: 0 0 15px 0;
            font-size: 1.2rem;
            color: var(--text-dark);
            border-bottom: 2px solid var(--sky-base);
            padding-bottom: 10px;
        }

        .stat-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            font-size: 0.95rem;
            font-weight: 600;
        }

        .stat-value {
            color: var(--danger);
            font-size: 1.1rem;
        }

        /* Termómetro Visual */
        .thermometer {
            width: 100%;
            height: 15px;
            background: #ecf0f1;
            border-radius: 10px;
            margin: 15px 0;
            overflow: hidden;
            position: relative;
        }

        .thermometer-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(to right, #2ecc71, #f1c40f, #e74c3c);
            border-radius: 10px;
            transition: width 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .status-message {
            font-size: 0.9rem;
            font-weight: bold;
            text-align: center;
            padding: 10px;
            border-radius: 8px;
            background: #e8f8f5;
            color: var(--success);
            transition: all 0.5s;
        }

        .status-message.warning { background: #fef9e7; color: #b7950b; }
        .status-message.danger { background: #fadbd8; color: var(--danger); animation: pulseDanger 1s infinite; }

        @keyframes pulseDanger {
            0% { transform: scale(1); }
            50% { transform: scale(1.02); }
            100% { transform: scale(1); }
        }

        .btn-reset {
            width: 100%;
            margin-top: 15px;
            padding: 10px;
            background: var(--text-dark);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }
        .btn-reset:hover { background: #1a252c; }

        /* Alerta visual */
        .instruction {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 0.9rem;
            z-index: 20;
            pointer-events: none;
            transition: opacity 0.5s;
        }

    </style>
</head>
<body>

<div class="sim-container" id="simContainer">
    
    <!-- Sol y Rayos -->
    <div class="sun-container">
        <div class="sun"></div>
        <div class="ray" style="transform: rotate(20deg);"></div>
        <div class="ray" style="transform: rotate(45deg);"></div>
    </div>

    <!-- Panel de Control -->
    <div class="control-panel">
        <h2 class="panel-title">🌡️ Monitor de Calor</h2>
        
        <div class="stat-row">
            <span>Emisiones (CO₂e):</span>
            <span class="stat-value" id="co2Display">0 t</span>
        </div>
        <div class="stat-row">
            <span>Temperatura Global:</span>
            <span class="stat-value" id="tempDisplay">+0.0°C</span>
        </div>

        <div class="thermometer">
            <div class="thermometer-fill" id="thermometerFill"></div>
        </div>

        <div class="status-message" id="statusMessage">
            Clima Estable. Haz clic en los objetos.
        </div>

        <button class="btn-reset" id="resetBtn">🔄 Reiniciar Simulación</button>
    </div>

    <!-- Burbuja de Efecto Invernadero -->
    <div class="greenhouse-bubble" id="bubble">
        <div class="bubble-label">Capa de Gases de Efecto Invernadero</div>
    </div>

    <!-- Suelo -->
    <div class="ground"></div>

    <!-- Objetos de la Ciudad -->
    <div class="city-items" id="cityItems">
        <!-- Los objetos se generan con JS -->
    </div>

    <div class="instruction" id="instruction">👆 Haz clic en los objetos para activar/desactivar sus emisiones</div>

</div>

<script>
    // 1. Datos de los objetos
    const sources = [
        { id: 'factory', icon: '🏭', name: 'Fábrica', co2: 15, temp: 0.8 },
        { id: 'car', icon: '🚗', name: 'Auto', co2: 5, temp: 0.3 },
        { id: 'cow', icon: '🐄', name: 'Ganadería', co2: 8, temp: 0.5 },
        { id: 'plane', icon: '✈️', name: 'Avión', co2: 10, temp: 0.6 },
        { id: 'tree', icon: '🌳', name: 'Bosque', co2: -10, temp: -0.5 } // Sumidero
    ];

    let state = {};
    sources.forEach(s => state[s.id] = false); // Todos inactivos al inicio

    // Elementos DOM
    const container = document.getElementById('simContainer');
    const cityItems = document.getElementById('cityItems');
    const bubble = document.getElementById('bubble');
    const co2Display = document.getElementById('co2Display');
    const tempDisplay = document.getElementById('tempDisplay');
    const thermometerFill = document.getElementById('thermometerFill');
    const statusMessage = document.getElementById('statusMessage');
    const instruction = document.getElementById('instruction');

    // 2. Renderizar Objetos
    sources.forEach(source => {
        const el = document.createElement('div');
        el.className = 'interactive-obj';
        el.id = `obj-${source.id}`;
        el.innerHTML = `
            <div class="smoke"></div>
            ${source.icon}
        `;
        
        // Evento de clic
        el.addEventListener('click', () => toggleSource(source.id, el));
        
        cityItems.appendChild(el);
    });

    // 3. Lógica de Interacción
    function toggleSource(id, element) {
        state[id] = !state[id]; // Cambiar estado
        
        // Ocultar instrucción inicial
        instruction.style.opacity = '0';

        if (state[id]) {
            element.classList.add('active');
        } else {
            element.classList.remove('active');
        }

        updateSimulation();
    }

    function updateSimulation() {
        let totalCO2 = 0;
        let totalTemp = 0;

        // Calcular totales basados en el estado
        sources.forEach(source => {
            if (state[source.id]) {
                totalCO2 += source.co2;
                totalTemp += source.temp;
            }
        });

        // Evitar valores negativos irreales
        if (totalCO2 < 0) totalCO2 = 0;
        if (totalTemp < 0) totalTemp = 0;

        // Actualizar textos
        co2Display.innerText = totalCO2 + ' t';
        tempDisplay.innerText = '+' + totalTemp.toFixed(1) + '°C';

        // Actualizar termómetro (Max 50t de CO2 para llenar la barra)
        let percentage = (totalCO2 / 40) * 100;
        if (percentage > 100) percentage = 100;
        thermometerFill.style.width = percentage + '%';

        // Actualizar Burbuja de Efecto Invernadero (Max altura 60% de la pantalla)
        let bubbleHeight = (totalCO2 / 40) * 60;
        if (bubbleHeight > 60) bubbleHeight = 60;
        bubble.style.height = bubbleHeight + '%';

        if (bubbleHeight > 5) {
            bubble.classList.add('active');
        } else {
            bubble.classList.remove('active');
        }

        // Cambiar color de fondo y estados
        if (totalCO2 === 0) {
            container.style.backgroundColor = 'var(--sky-base)';
            statusMessage.className = 'status-message';
            statusMessage.innerText = 'Clima Estable. Todo en equilibrio.';
        } else if (totalCO2 <= 15) {
            container.style.backgroundColor = '#ffd89b'; // Amarillo suave
            statusMessage.className = 'status-message warning';
            statusMessage.innerText = 'Aumento de temperatura. Inicio del efecto invernadero.';
        } else {
            container.style.backgroundColor = 'var(--sky-hot)'; // Naranja/Rojo
            statusMessage.className = 'status-message danger';
            statusMessage.innerText = '¡ALERTA! El calor está atrapado. Crisis climática.';
        }
    }

    // 4. Reiniciar
    document.getElementById('resetBtn').addEventListener('click', () => {
        sources.forEach(source => {
            state[source.id] = false;
            document.getElementById(`obj-${source.id}`).classList.remove('active');
        });
        
        instruction.style.opacity = '1';
        updateSimulation();
    });

    // Inicializar
    updateSimulation();

</script>
</body>
</html>
